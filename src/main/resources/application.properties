spring.application.name=demo
server.port=${PORT:8080}

# --- CONFIGURACIÓN DE BASE DE DATOS (Híbrida) ---
# Si existe la variable DATABASE_URL (Railway), usa PostgreSQL. Si no, H2 local.
spring.datasource.url=${JDBC_DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/granada_flats}}
spring.datasource.username=${JDBC_DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driverClassName=${JDBC_DATABASE_DRIVER_CLASS_NAME:org.h2.Driver}

# Dialecto inteligente
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Desactivar seguridad CSRF para facilitar pruebas
spring.security.csrf.disable=true

# Permitir acceso a la consola H2 solo en local
spring.h2.console.enabled=true
