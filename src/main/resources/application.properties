spring.application.name=demo
server.address=0.0.0.0
server.port=${PORT:8080}

# Configuración Base de Datos (Prioridad Railway PostgreSQL, fallback H2 local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/granada_flats}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Persistencia y actualización de tablas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# Desactivar temporalmente la protección de CSRF para probar POST en desarrollo
spring.security.csrf.disable=true
