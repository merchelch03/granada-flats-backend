spring.application.name=demo
server.port=${PORT:8080}

# Forzamos el uso de PostgreSQL y que falle rápido si no conecta
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# Configuración de Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Cambiamos a 'create' solo esta vez para obligar a la DB a reaccionar
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true

# Logs extra para ver el error real si falla la conexión
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.zaxxer.hikari=DEBUG

spring.security.csrf.disable=true
