spring.application.name=demo
server.address=0.0.0.0
server.port=${PORT:8080}

# Si existe PGHOST (estamos en Railway), usamos PostgreSQL. Si no, H2 local.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:granada_flats}?user=${PGUSER:sa}&password=${PGPASSWORD:}
spring.datasource.driverClassName=org.postgresql.Driver

# Fallback para H2 si no hay variables de Postgres (Descomenta estas 2 líneas si pruebas en tu PC sin Postgres)
# spring.datasource.url=jdbc:h2:file:./data/granada_flats
# spring.datasource.driverClassName=org.h2.Driver

# Dialecto inteligente: detecta si es Postgres o H2
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}

# Forzar la creación de tablas al arrancar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Desactivar seguridad CSRF
spring.security.csrf.disable=true
