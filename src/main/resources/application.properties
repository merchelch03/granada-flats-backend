spring.application.name=demo
server.port=${PORT:8080}

# Si Railway inyecta la URL, la usamos. Si no, usamos H2 local.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/granada_flats}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# Hibernate: 'update' para que cree las tablas si no existen
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.security.csrf.disable=true
