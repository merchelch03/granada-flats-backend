spring.application.name=demo
server.port=${PORT:8080}

# --- CONFIGURACIÓN DE BASE DE DATOS (Inteligente) ---
# Railway inyecta automáticamente estas variables si los servicios están enlazados
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/granada_flats}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# Dialecto: Hibernate detectará automáticamente si es Postgres o H2 según la URL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Desactivar seguridad CSRF
spring.security.csrf.disable=true
