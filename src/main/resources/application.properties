spring.application.name=demo
server.port=8080

# --- CONFIGURACIÓN DE PERSISTENCIA ---
# Dejamos esto vacío para que el "Build" de Railway no falle buscando secretos.
# Spring Boot detectará las variables de entorno automáticamente al arrancar.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Ajuste para PostgreSQL (necesario en la nube)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Desactivar seguridad CSRF
spring.security.csrf.disable=true
