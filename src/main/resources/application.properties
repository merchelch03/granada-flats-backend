spring.application.name=demo
server.address=0.0.0.0
server.port=${PORT:8080}

# Prioridad 1: DATABASE_URL (Railway lo da entero)
# Prioridad 2: Desglose manual de variables (PGHOST, etc)
# Prioridad 3: H2 local para tu ordenador
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:file:./data/granada_flats}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:}}
spring.datasource.driverClassName=org.postgresql.Driver

# Dialecto para PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Desactivar seguridad CSRF
spring.security.csrf.disable=true
