spring.application.name=demo
server.port=${PORT:8080}

# Si estamos en Railway, usaremos la variable DATABASE_URL que inyecta el sistema
# Si estamos en local, usaremos H2
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:file:./data/granada_flats}
spring.datasource.username=${JDBC_DATABASE_USERNAME:sa}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:}

# Dialecto inteligente: detecta si es Postgres o H2
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# Cambiamos temporalmente a 'create' para forzar la creación de tablas en la nube
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Desactivar seguridad CSRF
spring.security.csrf.disable=true
